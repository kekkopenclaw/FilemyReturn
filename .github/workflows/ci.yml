# DocuArchive CI — free GitHub Actions only (ubuntu-latest runners, public repo)
# NOTE: workflow files cannot be pushed by the GitHub App (403) — upload this file
# via github.com at .github/workflows/ci.yml (parent agent has the upload link).
# No paid runners, no paid Actions, no secrets in this file. Test secrets are
# placeholders for the CI run only (ADMIN_PASSWORD / Jwt__Key set as env here).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ADMIN_PASSWORD: "CiTestPassword123!@#"
      Jwt__Key: "ci-test-jwt-key-0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build backend/DocuArchive.slnx -c Release --nologo
      - name: Test
        run: dotnet test backend/DocuArchive.slnx -c Release --nologo
      # NOTE: `dotnet test` (vstest) fails to connect to testhost in this dev VM
      # (environmental, proven with a stock xunit project) — it is expected to
      # work on GitHub runners. If it ever fails there, the fallback is the
      # Microsoft.Testing.Platform direct run:
      #   dotnet backend/tests/DocuArchive.Tests/bin/Release/net10.0/DocuArchive.Tests.dll

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npx ng build --configuration production

  # Prove the production image builds on every push. The Render Docker build
  # failed twice ("Exited with status 1", 10s and 27s) with no usable log from
  # the Render API — this job is the diagnosable copy of that build. It only
  # builds the image; it never pushes it anywhere and needs no secrets.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t docuarchive:ci .
