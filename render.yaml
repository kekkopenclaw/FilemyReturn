# DocuArchive — Render Free deploy (render.yaml)
# Direct Git deploy via Render dashboard / Render API. NO GitHub Marketplace install
# (the Marketplace install asks for a payment method to verify — do not use it).
# Free plan, Frankfurt region, Docker runtime, health check GET /health.
# One service: the API serves the Angular build from wwwroot, SQLite on ephemeral disk.
# Secrets are generated by Render (generateValue) or set in the dashboard — never in this file.
services:
  - type: web
    name: docuarchive
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: Sqlite
      - key: ConnectionStrings__Default
        value: "Data Source=/app/data/docuarchive.db"
      - key: Storage__RootPath
        value: /app/data/storage
      - key: Jwt__Key
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      # Frontend__Origin: set in the Render dashboard AFTER first deploy, to the
      # service URL (https://docuarchive.onrender.com). Same-origin in practice
      # (API serves the frontend), so the default is safe until then.
      - key: Frontend__Origin
        value: https://docuarchive.onrender.com
